[project]
name = "typed-decisions"
version = "0.1.0"
description = "Single-token readout of LLM choices over labelled options, with calibrated probabilities"
readme = "README.md"
authors = [
    { name = "renziver", email = "renziverdb@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.1.0",
    "numpy>=2.5.4",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.19.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "types-tqdm>=4.70.0.20260906",
]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "datasets"
ignore_missing_imports = true
